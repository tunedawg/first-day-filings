<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing in… — First Day Filings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.__FDF_CONFIG__ = {
        supabaseUrl: "{{SUPABASE_URL}}",
        supabaseAnonKey: "{{SUPABASE_ANON_KEY}}",
        siteUrl: "{{SITE_URL}}"
      };
    </script>
    <script src="/auth-callback.js" type="module"></script>
    <style>
      .callback-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .callback-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(124, 58, 237, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .callback-msg {
        color: var(--text2);
        font-size: 0.95rem;
      }

      .callback-error {
        color: var(--error);
        font-size: 0.9rem;
        text-align: center;
        max-width: 360px;
        line-height: 1.5;
      }

      .callback-error a {
        color: var(--accent-hi);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="callback-shell">
      <div class="callback-spinner" id="spinner"></div>
      <p class="callback-msg" id="callbackMsg">Completing sign-in…</p>
      <p class="callback-error" id="callbackError" hidden></p>
    </div>
  </body>
</html>
