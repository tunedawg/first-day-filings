<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — First Day Filings</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.__FDF_CONFIG__ = {
        supabaseUrl: "{{SUPABASE_URL}}",
        supabaseAnonKey: "{{SUPABASE_ANON_KEY}}",
        siteUrl: "{{SITE_URL}}"
      };
    </script>
    <script src="/login.js" type="module"></script>
    <style>
      .login-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .login-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--accent-hi);
        margin-bottom: 40px;
      }

      .login-brand svg { width: 28px; height: 28px; }

      .login-brand-name {
        color: var(--text);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
      }

      .login-heading {
        font-family: var(--serif);
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        line-height: 1.1;
      }

      .login-sub {
        color: var(--text2);
        font-size: 0.9rem;
        margin: 0 0 32px;
        line-height: 1.5;
      }

      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 13px 20px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: 500 0.9rem/1 var(--sans);
        cursor: pointer;
        transition: all 0.15s;
        text-decoration: none;
        margin-bottom: 10px;
      }

      .oauth-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.18);
      }

      .oauth-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

      .oauth-btn-google { border-color: rgba(167, 139, 250, 0.25); background: rgba(124, 58, 237, 0.06); }
      .oauth-btn-google:hover { border-color: rgba(167, 139, 250, 0.45); background: rgba(124, 58, 237, 0.12); }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: var(--text3);
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .field-label {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text2);
        margin-bottom: 6px;
      }

      .field-input {
        display: block;
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: 0.9rem/1.4 var(--sans);
        outline: none;
        transition: border-color 0.15s;
        margin-bottom: 14px;
      }

      .field-input:focus { border-color: var(--accent); }
      .field-input::placeholder { color: var(--text3); }

      .login-submit {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font: 600 0.9rem/1 var(--sans);
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 4px;
      }

      .login-submit:hover { background: #6d28d9; }
      .login-submit:disabled { opacity: 0.5; cursor: not-allowed; }

      .login-toggle {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: var(--text2);
        font-size: 0.85rem;
      }

      .login-toggle a {
        color: var(--accent-hi);
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
      }

      .login-toggle a:hover { text-decoration: underline; }

      .forgot-link {
        display: block;
        text-align: right;
        font-size: 0.8rem;
        color: var(--text2);
        text-decoration: none;
        margin-top: -8px;
        margin-bottom: 16px;
        cursor: pointer;
      }

      .forgot-link:hover { color: var(--accent-hi); }

      .login-error {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.25);
        color: var(--error);
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .login-info {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.2);
        color: var(--success);
        font-size: 0.85rem;
        line-height: 1.4;
      }

      #emailForm[hidden], #passwordResetForm[hidden] { display: none; }

      .login-footer {
        margin-top: 40px;
        text-align: center;
        color: var(--text3);
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <a href="/" class="login-brand">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M9 5.5h10.5c3.6 0 5.5 1.8 5.5 5.2v13.1c0 2.9-1.8 4.7-4.8 4.7H9.8C6.8 28.5 5 26.7 5 23.8V10.2c0-3 1.9-4.7 4-4.7Z" fill="currentColor" opacity="0.18"/>
          <path d="M12 4.5h8.8c3.1 0 4.7 1.6 4.7 4.6v12.4c0 3.3-1.8 5-5 5H11.2c-3 0-4.7-1.7-4.7-4.8V9.1c0-3 1.7-4.6 4.6-4.6Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M11 11h10M11 16h10M11 21h6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20.5 4.8v3.7c0 1 .5 1.5 1.5 1.5h3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="login-brand-name">First Day Filings</span>
      </a>

      <div class="login-card">
        <h1 class="login-heading">Welcome back</h1>
        <p class="login-sub">Sign in to your firm's account to continue.</p>

        <div id="loginError" class="login-error" hidden></div>
        <div id="loginInfo" class="login-info" hidden></div>

        <!-- Google OAuth -->
        <button class="oauth-btn oauth-btn-google" id="googleSignInBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <!-- Email / password form -->
        <div id="emailForm">
          <label class="field-label" for="emailInput">Email address</label>
          <input class="field-input" id="emailInput" type="email" placeholder="you@yourfirm.com" autocomplete="email" />

          <label class="field-label" for="passwordInput">Password</label>
          <input class="field-input" id="passwordInput" type="password" placeholder="••••••••" autocomplete="current-password" />

          <a class="forgot-link" id="forgotPasswordLink">Forgot password?</a>

          <button class="login-submit" id="emailSignInBtn" type="button">Sign in</button>

          <span class="login-toggle">
            Don't have an account? <a id="toggleSignUpLink">Create one</a>
          </span>
        </div>

        <!-- Password reset form (shown when "Forgot password?" clicked) -->
        <div id="passwordResetForm" hidden>
          <p style="color: var(--text2); font-size: 0.88rem; margin: 0 0 16px; line-height: 1.5;">
            Enter your email and we'll send you a reset link.
          </p>
          <label class="field-label" for="resetEmailInput">Email address</label>
          <input class="field-input" id="resetEmailInput" type="email" placeholder="you@yourfirm.com" autocomplete="email" />
          <button class="login-submit" id="sendResetBtn" type="button">Send reset link</button>
          <span class="login-toggle" style="margin-top: 14px;">
            <a id="backToSignInLink">← Back to sign in</a>
          </span>
        </div>
      </div>

      <p class="login-footer">
        First Day Filings &mdash; Missouri employment litigation automation
      </p>
    </div>
  </body>
</html>
