<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Keenan &amp; Bhatia</title>
    <meta name="description" content="Sign in to Keenan &amp; Bhatia internal tools with your firm Google account." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{SITE_URL}}/login" />
    <meta property="og:title" content="Sign In — Keenan &amp; Bhatia" />
    <meta property="og:description" content="Sign in to Keenan &amp; Bhatia internal tools with your firm Google account." />
    <meta property="og:image" content="{{SITE_URL}}/social-card-login.svg" />
    <meta property="og:image:secure_url" content="{{SITE_URL}}/social-card-login.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keenan &amp; Bhatia internal tools — sign in." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign In — Keenan &amp; Bhatia" />
    <meta name="twitter:description" content="Sign in to Keenan &amp; Bhatia internal tools with your firm Google account." />
    <meta name="twitter:image" content="{{SITE_URL}}/social-card-login.svg" />
    <meta name="twitter:image:alt" content="Keenan &amp; Bhatia internal tools — sign in." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.__FDF_CONFIG__ = {
        supabaseUrl: "{{SUPABASE_URL}}",
        supabaseAnonKey: "{{SUPABASE_ANON_KEY}}",
        siteUrl: "{{SITE_URL}}"
      };
    </script>
    <script src="/login.js" type="module"></script>
    <style>
      .login-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .login-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--accent-hi);
        margin-bottom: 40px;
      }

      .login-brand svg { width: 28px; height: 28px; }

      .login-brand-name {
        color: var(--text);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        text-align: center;
      }

      .login-heading {
        font-family: var(--serif);
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
        line-height: 1.1;
      }

      .login-sub {
        color: var(--text2);
        font-size: 0.88rem;
        margin: 0 0 36px;
        line-height: 1.5;
      }

      .oauth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 14px 20px;
        border-radius: 10px;
        border: 1px solid rgba(167, 139, 250, 0.3);
        background: rgba(124, 58, 237, 0.07);
        color: var(--text);
        font: 500 0.95rem/1 var(--sans);
        cursor: pointer;
        transition: all 0.15s;
        text-decoration: none;
      }

      .oauth-btn:hover {
        background: rgba(124, 58, 237, 0.14);
        border-color: rgba(167, 139, 250, 0.5);
      }

      .oauth-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

      .login-error {
        margin-bottom: 20px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.25);
        color: var(--error);
        font-size: 0.85rem;
        line-height: 1.4;
        text-align: left;
      }

      .login-domain-note {
        margin-top: 20px;
        color: var(--text3);
        font-size: 0.78rem;
        line-height: 1.5;
      }

      .login-footer {
        margin-top: 40px;
        text-align: center;
        color: var(--text3);
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <a href="/" class="login-brand">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M9 5.5h10.5c3.6 0 5.5 1.8 5.5 5.2v13.1c0 2.9-1.8 4.7-4.8 4.7H9.8C6.8 28.5 5 26.7 5 23.8V10.2c0-3 1.9-4.7 4-4.7Z" fill="currentColor" opacity="0.18"/>
          <path d="M12 4.5h8.8c3.1 0 4.7 1.6 4.7 4.6v12.4c0 3.3-1.8 5-5 5H11.2c-3 0-4.7-1.7-4.7-4.8V9.1c0-3 1.7-4.6 4.6-4.6Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M11 11h10M11 16h10M11 21h6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20.5 4.8v3.7c0 1 .5 1.5 1.5 1.5h3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="login-brand-name">First Day Filings</span>
      </a>

      <div class="login-card">
        <h1 class="login-heading">Keenan &amp; Bhatia</h1>
        <p class="login-sub">Internal tools &mdash; sign in with your firm Google account.</p>

        <div id="loginError" class="login-error" hidden></div>

        <button class="oauth-btn" id="googleSignInBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <p class="login-domain-note">@kclaborlaw.com and @keenanfirm.com accounts only.</p>
      </div>

      <p class="login-footer">First Day Filings &mdash; Missouri employment litigation automation</p>
    </div>
  </body>
</html>
